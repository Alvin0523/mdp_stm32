manifest:
  remotes:
    - name: zephyrproject-rtos
      url-base: https://github.com/zephyrproject-rtos
    - name: micro-ROS
      url-base: https://github.com/micro-ROS

  projects:
    - name: zephyr
      remote: zephyrproject-rtos
      revision: v4.0.0
      import:
        name-allowlist:
          - cmsis          # ARM Cortex core headers
          - hal_stm32      # ST hardware abstraction (STM32F407 drivers/pinctrl/clock)
          - picolibc       # Small C library
          - segger         # SEGGER RTT debug print over ST-LINK
    - name: micro_ros_zephyr_module
      remote: micro-ROS
      revision: 229ffc0e131ee7942db3bb2e731fb8851583bb25

  self:
    path: .
