[workspace]
authors = ["Wei Ming <alvinwm0523@gmail.com>"]
channels = ["conda-forge"]
name = "mdp_stm32"
platforms = ["linux-64", "osx-arm64", "linux-aarch64"]
version = "0.1.0"

[tasks]
probe = { cmd = 'pio pkg exec -p tool-openocd -- openocd -f interface/stlink.cfg -f target/stm32f4x.cfg -c "init; targets; exit"', description = "Detect the ST-Link and the STM32 (OpenOCD)" }

build = { cmd = "pio run", description = "Build firmware via PlatformIO" }
flash = { cmd = "pio run -t upload", description = "Flash over USB (UART1, /dev/stm32_flash)" }
flash-stlink = { cmd = "pio run -e stlink -t upload", description = "Flash the firmware with an ST-Link on the SWD header" }
monitor = { cmd = "pio device monitor", description = "Debug printf on UART1 (/dev/stm32_flash, platformio.ini)" }

udev = { cmd = "udev/install.sh", description = "Once per machine: udev rule for /dev/stm32_serial + /dev/stm32_flash (sudo)" }

[dependencies]
pyserial = "*"
platformio = "*"
