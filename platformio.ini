; PlatformIO Project Configuration File
; Board: WHEELTEC C30D (STM32F407VET6)
; Framework: STM32Cube HAL

[platformio]
default_envs = genericSTM32F407VET6

[env:genericSTM32F407VET6]
platform = ststm32
board = genericSTM32F407VET6
framework = stm32cube

; Override pinned toolchain version - default range has no linux_aarch64 build
; (needed for building on Raspberry Pi 64-bit OS / other ARM64 hosts)
platform_packages =
    toolchain-gccarmnoneeabi@~1.90301.0
    platformio/tool-stm32flash

; Flash over USB (`pixi run flash`): the board's UART1 USB-C port into the
; STM32's built-in bootloader - no ST-Link. The port's RTS/DTR drive the
; board's auto-boot circuit, which only acts when they differ (tested on the
; board 2026-10-05): DTR on + RTS off holds reset, RTS on + DTR off raises
; BOOT0. "rts&-dtr,dtr&-rts,-dtr" = BOOT0 high, reset, release -> bootloader.
; -g starts the new firmware with a jump (no second reset needed).
; /dev/stm32_flash: udev rule, `pixi run udev`. ST-Link: `pixi run flash-stlink`.
upload_protocol = custom
upload_port = /dev/stm32_flash
upload_command = $PROJECT_PACKAGES_DIR/tool-stm32flash/stm32flash -b 115200 -i "rts&-dtr,dtr&-rts,-dtr" -w $SOURCE -v -g 0x08000000 $UPLOAD_PORT
debug_tool = stlink

; Serial monitor (`pixi run monitor`): the debug printf on UART1
monitor_port = /dev/stm32_flash
monitor_speed = 115200

; Compiler Build Flags
build_flags =
    -I include         ; Add include/ directory to C compiler search path
    -D STM32F407xx     ; Enable register definitions for STM32F407 chip family
    -D USE_HAL_DRIVER  ; Enable ST Hardware Abstraction Layer (HAL) drivers
    -D HSE_VALUE=8000000L ; Set external crystal oscillator frequency to 8 MHz
    -Wl,-u,_printf_float ; Enable %f floating point formatting in printf
; Flash with an ST-Link on the SWD header instead (`pixi run flash-stlink`)
[env:stlink]
extends = env:genericSTM32F407VET6
upload_protocol = stlink
